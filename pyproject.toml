
[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"


[project]
name = "adpm-template"
version = "1.1.0"
authors = [
    {name = "GMQ Team"},
]
description = "Template for Algorithm Description and Processing Model documents"
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
license-files = ["LICEN[CS]E*", "AUTHORS.rst"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "build>=1.5.0",
    "furo>=2025.12.19",
    "ipykernel>=7",
    "matplotlib>=3.9",
    "nbsphinx>=0.9",
    "numpy>=2",
    "pypandoc-binary>=1.17",
    "ruff>=0.16.4",
    "sphinx>=8",
    "sphinx-rtd-theme>=3.1.0",
    "sphinxcontrib-spelling>=8.0.2",
    "twine>=7.0.0",
    "just"
]


[project.urls]
Homepage = "https://github.com/s1tools/adpm-template"
Repository = "https://github.com/s1tools/adpm-template.git"
Issues = "https://github.com/s1tools/adpm-template/issues"


[tool.ruff]
# Set the maximum line length to 79.
line-length = 120


[tool.ruff.lint]
# Add the `line-too-long` rule to the enforced rule set. By default, Ruff omits rules that
# overlap with the use of a formatter, like Black, but we can override this behavior by
# explicitly adding the rule.
extend-select = ["E501"]


[tool.codespell]
skip = "./adpm/_build"
count = true
quiet-level = 3
ignore-words="adpm/spelling_wordlist.txt"
